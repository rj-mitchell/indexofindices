<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Solid Black Background Squircle -->
  <rect width="100" height="100" rx="22" fill="#000000" />
  <rect width="96" height="96" x="2" y="2" rx="20" fill="none" stroke="#262626" stroke-width="1.5" />

  <!-- Globe Positioned Towards the Right-Hand Side (Underneath the Sigma) -->
  <g>
    <!-- Globe Ocean Body -->
    <circle cx="60" cy="50" r="27" fill="#060c18" stroke="#38bdf8" stroke-width="2.5" />

    <!-- Latitudes / Parallels -->
    <line x1="33" y1="50" x2="87" y2="50" stroke="#38bdf8" stroke-width="1.75" opacity="0.65" />
    <path d="M 37 38 Q 60 45 83 38" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.55" />
    <path d="M 37 62 Q 60 55 83 62" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.55" />

    <!-- Longitudes / Meridians -->
    <line x1="60" y1="23" x2="60" y2="77" stroke="#38bdf8" stroke-width="1.75" opacity="0.65" />
    <ellipse cx="60" cy="50" rx="13.5" ry="27" fill="none" stroke="#38bdf8" stroke-width="1.75" opacity="0.75" />
  </g>

  <!-- Plain Coloured Sigma Superimposed in Foreground -->
  <!-- Dark Knockout Halo to separate Sigma cleanly from Globe lines -->
  <path d="M 68 22 L 22 22 L 46 50 L 22 78 L 68 78" 
        fill="none" 
        stroke="#000000" 
        stroke-width="14" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Crisp Solid White Sigma Foreground -->
  <path d="M 68 22 L 22 22 L 46 50 L 22 78 L 68 78" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="9" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>
